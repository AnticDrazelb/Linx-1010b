# Compressed swap in RAM. On a 2 GB machine this is the difference between
# "GNOME runs" and "GNOME thrashes the eMMC to death".
#
# lz4 rather than zstd: zstd compresses ~30% better but costs far more CPU to
# decompress, and CPU is the scarcer resource on a 1.33 GHz Silvermont core.
# lz4 keeps page faults cheap enough that swapping stays invisible.

[zram0]
zram-size = ram
compression-algorithm = lz4
swap-priority = 100
fs-type = swap
