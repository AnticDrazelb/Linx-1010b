[Login]
# Tablet lid/power button behaviour.
HandlePowerKey=suspend
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# One graphical session on a 2 GB machine. Do not keep a second user's session
# and its whole GNOME stack resident.
KillUserProcesses=yes

# Reserve fewer VTs; each allocated VT costs a little memory and boot time.
NAutoVTs=2
ReserveVT=2
