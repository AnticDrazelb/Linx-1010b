[Journal]
# Volatile journal: logs live in RAM and vanish on reboot. On a 32 GB eMMC with
# limited write endurance and ~40 MB/s writes, a persistent journal is a
# continuous background write load for very little benefit on a personal tablet.
# If you are debugging something across reboots, `linx-tune logs-persistent`.
Storage=volatile
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M
Compress=yes
SystemMaxUse=64M

# Do not fsync after every message.
SyncIntervalSec=5m

# Rate-limit chatty units so a driver error loop cannot eat the CPU.
RateLimitIntervalSec=30s
RateLimitBurst=1000
