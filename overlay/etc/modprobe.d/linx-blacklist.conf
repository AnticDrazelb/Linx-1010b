# Hardware this tablet does not have, or drivers that only cost us probe time,
# RAM and boot seconds. Stripping these is worth roughly a second of boot and a
# few MB resident on a 2 GB machine.

# No discrete or alternative GPUs.
blacklist nouveau
blacklist radeon
blacklist amdgpu

# No wired Ethernet on the tablet or the keyboard dock.
blacklist eepro100
blacklist e1000
blacklist e1000e
blacklist r8169

# No floppy, parallel port, game port, IrDA, PCMCIA, or FireWire.
blacklist floppy
blacklist parport
blacklist parport_pc
blacklist lp
blacklist ppdev
blacklist joydev
blacklist firewire_core
blacklist firewire_ohci

# The MIPI/ISP cameras are not usable on Linux (Windows-only drivers), so the
# atomisp stack only ever wastes memory and produces error spam.
blacklist atomisp
blacklist atomisp_gmin_platform

# Rarely-used filesystems and network protocols that are attack surface and
# module-probe latency on a single-user tablet.
install dccp /bin/true
install sctp /bin/true
install rds /bin/true
install tipc /bin/true
install cramfs /bin/true
install freevxfs /bin/true
install jffs2 /bin/true
install hfs /bin/true
install hfsplus /bin/true
