# Bay Trail audio (Realtek codec on the Intel SST DSP).
#
# Modern kernels default to the SOF (Sound Open Firmware) driver stack for Intel
# DSPs. On Bay Trail-T that path is unreliable and on this tablet it produces a
# card with no working output. Force the legacy Atom SST driver instead.
#
#   dsp_driver=  0=auto  1=legacy  2=SST  3=SOF  4=AVS
#
# 2 (SST) is the correct value for Bay Trail-T. If you ever want to test SOF,
# `linx-tune audio-sof` flips this and rebuilds the initramfs.
options snd-intel-dspcfg dsp_driver=2

# Note: these tablets shipped with more than one Realtek codec depending on the
# production batch (rt5640 is by far the most common, rt5645/rt5651 exist). The
# dsp_driver setting above is codec-independent. Do NOT pin a card slot to a
# specific codec module here - if your unit has a different codec the reserved
# slot stays empty and the real card lands at index 1. Run `linx-report audio`
# to see which codec you actually have.

# No PC speaker on a tablet.
blacklist pcspkr
blacklist snd_pcsp
