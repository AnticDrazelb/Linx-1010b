# Realtek SDIO Wi-Fi (RTL8723BS family) as fitted to Bay Trail tablets.
#
# Defaults keep power management on, which is what you want for battery life.
# If you see the link stalling or dropping under load, `linx-tune wifi-stable`
# switches these to the aggressive-but-power-hungry settings below:
#
#   options r8723bs rtw_power_mgnt=0 rtw_ips_mode=0
#
# Many of these tablets have no MAC address programmed in the Wi-Fi EEPROM and
# get a fresh random MAC on every boot, which breaks DHCP reservations and
# captive portals. See overlay/etc/systemd/network/ and docs/troubleshooting.md.

# --- Regulatory domain -------------------------------------------------------
# Without this, the kernel starts in the "world" domain (00), under which
# channels 12 and 13 are flagged no-IR: the radio may passively hear beacons on
# them but is not permitted to transmit, so those networks appear in a scan and
# then cannot be joined.
#
# UK routers commonly sit on channel 12 or 13, while public hotspots almost
# always use 1, 6 or 11. That produces the confusing symptom of a device that
# happily joins a hotspot in the street but refuses the network at home, and it
# is not fixed by removing the password, because the restriction is on the
# channel rather than the security.
#
# GB matches this tablet's market and the image's en_GB / Europe/London
# defaults. Change it with:  linx-tune wifi-region <CC>
options cfg80211 ieee80211_regdom=GB
