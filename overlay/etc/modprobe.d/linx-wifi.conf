# Realtek SDIO Wi-Fi (RTL8723BS family) as fitted to Bay Trail tablets.
#
# Defaults keep power management on, which is what you want for battery life.
# If you see the link stalling or dropping under load, `linx-tune wifi-stable`
# switches these to the aggressive-but-power-hungry settings below:
#
#   options r8723bs rtw_power_mgnt=0 rtw_ips_mode=0
#
# Many of these tablets have no MAC address programmed in the Wi-Fi EEPROM and
# get a fresh random MAC on every boot, which breaks DHCP reservations and
# captive portals. See overlay/etc/systemd/network/ and docs/troubleshooting.md.
