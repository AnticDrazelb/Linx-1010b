# Memory tuning for 2 GB RAM backed by zram swap.
#
# With a compressed RAM swap device, swapping is cheap (a memcpy plus lz4) rather
# than a seek on slow storage, so we want the kernel to prefer reclaiming anonymous
# pages instead of evicting the page cache it is about to re-read off a slow eMMC.
# 180 is the value the kernel's own zram documentation recommends; the ceiling is 200.
vm.swappiness = 180

# Reclaim in larger batches so kswapd wakes less often. Helps a slow 4-core Atom.
vm.watermark_scale_factor = 125

# Disable the watermark boost. It exists to fight fragmentation for huge pages,
# which this machine does not benefit from, and it causes needless reclaim churn.
vm.watermark_boost_factor = 0

# zram has no readahead benefit - faulting in neighbouring pages just wastes CPU
# decompressing pages nothing asked for. 0 means "one page at a time".
vm.page-cluster = 0

# Keep dentry/inode caches; re-reading metadata from eMMC is expensive.
vm.vfs_cache_pressure = 50

# 2 GB of RAM means the default dirty ratios allow a very large writeback burst,
# which stalls the desktop for seconds on a ~40 MB/s eMMC. Cap it much lower.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.dirty_expire_centisecs = 1500

# Slightly more aggressive OOM behaviour than default: on a 2 GB machine it is
# better to lose the runaway task quickly than to livelock in reclaim.
vm.oom_kill_allocating_task = 0
