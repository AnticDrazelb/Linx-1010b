# Misc kernel tuning for the Linx 1010B.

# No hardware watchdog value on a tablet; saves a per-CPU timer.
kernel.nmi_watchdog = 0

# Cut scheduler statistics collection. Small, but this CPU has little to spare.
kernel.sched_schedstats = 0

# Fewer timer interrupts when idle-ish; helps battery on a 7000 mAh cell.
kernel.timer_migration = 1

# Desktop responsiveness: let unprivileged users use perf a bit less, and keep
# dmesg readable for the troubleshooting scripts.
kernel.dmesg_restrict = 0
