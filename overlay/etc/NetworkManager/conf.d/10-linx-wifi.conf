[connection]
# Wi-Fi power saving: 3 = enable. Worth real battery life on this part.
# If the link becomes unreliable, `linx-tune wifi-stable` sets this to 2 (off).
wifi.powersave = 3

# Many of these tablets have no MAC burned into the Wi-Fi EEPROM and would
# otherwise present a new random MAC to the AP on every scan and every boot,
# which breaks DHCP reservations, captive portals and MAC filtering. Pin the
# address that the driver reports at first bring-up instead of randomising.
wifi.cloned-mac-address = permanent
ethernet.cloned-mac-address = permanent

[device]
wifi.scan-rand-mac-address = no
